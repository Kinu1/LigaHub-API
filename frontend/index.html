<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        let theme = null;
        try {
          const value = localStorage.getItem('ligahub:theme');
          if (['light', 'dark'].includes(value)) theme = value;
          else if (value !== null) localStorage.removeItem('ligahub:theme');
        } catch {}
        const dark = theme === null ? matchMedia('(prefers-color-scheme: dark)').matches : theme === 'dark';
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#17191d' : '#ffffff';
      })();
    </script>
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="/logo-lauen.png" />
    <title>LigaHub · Eventos acadêmicos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
