name: Navegador

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ligahub
          POSTGRES_PASSWORD: senha-exclusiva-ci
          POSTGRES_DB: ligahub_browser_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ligahub -d ligahub_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ligahub:senha-exclusiva-ci@127.0.0.1:5433/ligahub_browser_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: falhas-navegador
          path: |
            playwright-report/
            test-results/
          retention-days: 7
