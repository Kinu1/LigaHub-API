AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LigaHub - homologacao AWS + Supabase + Resend (sem provisionar o banco)
Parameters:
  RuntimeConfigParameter:
    Type: String
    Default: /ligahub/homologation/runtime-config
    AllowedPattern: '/[a-zA-Z0-9_./-]+'
    Description: Existing SSM SecureString parameter using the default aws/ssm key
  CloudFrontOriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    MaxLength: 128
    AllowedPattern: '[a-zA-Z0-9_-]+'
  EnableEmailSchedule:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  EnablePaymentSchedule:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
Conditions:
  EmailEnabled: !Equals [!Ref EnableEmailSchedule, 'true']
  PaymentEnabled: !Equals [!Ref EnablePaymentSchedule, 'true']
Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [x86_64]
    CodeUri: ../
    MemorySize: 512
    Timeout: 60
    Environment:
      Variables:
        NODE_ENV: production
        DEPLOYMENT_ENV: homologation
        MERCADO_PAGO_TEST_MODE: 'true'
        BACKGROUND_TIMERS_ENABLED: 'false'
        BACKGROUND_JOBS_ENABLED: 'false'
        API_DOCS_ENABLED: 'false'
        EMAIL_PROVIDER: resend
        EMAIL_DELIVERY_ENABLED: !Ref EnableEmailSchedule
        PAYMENT_RECONCILIATION_ENABLED: !Ref EnablePaymentSchedule
        DATABASE_POOL_MAX: '2'
        RUNTIME_CONFIG_PARAMETER: !Ref RuntimeConfigParameter
Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiLogs
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      Handler: dist/lambda/api.handler
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          CLOUDFRONT_ORIGIN_SECRET: !Ref CloudFrontOriginSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${RuntimeConfigParameter}'
  ApiUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      AuthType: NONE
  ApiUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE
  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true
  EmailFunction:
    Type: AWS::Serverless::Function
    DependsOn: EmailLogs
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub '${AWS::StackName}-emails'
      Handler: dist/lambda/emails.handler
      Timeout: 240
      ReservedConcurrentExecutions: 1
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 300
        MaximumRetryAttempts: 2
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${RuntimeConfigParameter}'
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt JobsDLQ.Arn
  PaymentFunction:
    Type: AWS::Serverless::Function
    DependsOn: PaymentLogs
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub '${AWS::StackName}-payments'
      Handler: dist/lambda/payments.handler
      Timeout: 240
      ReservedConcurrentExecutions: 1
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 300
        MaximumRetryAttempts: 2
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${RuntimeConfigParameter}'
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt JobsDLQ.Arn
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 7
  EmailLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-emails'
      RetentionInDays: 7
  PaymentLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-payments'
      RetentionInDays: 7
  JobsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/default'
      Policies:
        - PolicyName: InvokeJobs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  [!GetAtt EmailFunction.Arn, !GetAtt PaymentFunction.Arn]
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt JobsDLQ.Arn
  EmailSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: rate(1 minute)
      FlexibleTimeWindow: { Mode: 'OFF' }
      State: !If [EmailEnabled, ENABLED, DISABLED]
      Target:
        Arn: !GetAtt EmailFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{}'
        RetryPolicy: { MaximumRetryAttempts: 2, MaximumEventAgeInSeconds: 300 }
        DeadLetterConfig: { Arn: !GetAtt JobsDLQ.Arn }
  PaymentSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: rate(1 minute)
      FlexibleTimeWindow: { Mode: 'OFF' }
      State: !If [PaymentEnabled, ENABLED, DISABLED]
      Target:
        Arn: !GetAtt PaymentFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{}'
        RetryPolicy: { MaximumRetryAttempts: 2, MaximumEventAgeInSeconds: 300 }
        DeadLetterConfig: { Arn: !GetAtt JobsDLQ.Arn }
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireBackups
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt BackupBucket.Arn, !Sub '${BackupBucket.Arn}/*']
            Condition: { Bool: { aws:SecureTransport: 'false' } }
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              [!GetAtt FrontendBucket.Arn, !Sub '${FrontendBucket.Arn}/*']
            Condition: { Bool: { aws:SecureTransport: 'false' } }
  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-s3'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  FrontendRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      Name: !Sub '${AWS::StackName}-spa'
      FunctionConfig:
        { Comment: Frontend SPA routes only, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri === '/api' || request.uri.indexOf('/api/') === 0) return request;
          if (request.uri.split('/').pop().indexOf('.') === -1) request.uri = '/index.html';
          return request;
        }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        ViewerCertificate: { CloudFrontDefaultCertificate: true }
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: !Select [2, !Split ['/', !GetAtt ApiUrl.FunctionUrl]]
            OriginCustomHeaders:
              - HeaderName: x-ligahub-origin
                HeaderValue: !Ref CloudFrontOriginSecret
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FrontendRewrite.FunctionARN
        CacheBehaviors:
          - PathPattern: /api
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ApiViewerIp.FunctionARN
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ApiViewerIp.FunctionARN
  ApiViewerIp:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      Name: !Sub '${AWS::StackName}-viewer-ip'
      FunctionConfig:
        {
          Comment: Overwrite client IP before forwarding to Lambda,
          Runtime: cloudfront-js-2.0,
        }
      FunctionCode: |
        function handler(event) {
          event.request.headers['x-ligahub-client-ip'] = {value: event.viewer.ip};
          return event.request;
        }
  ApiErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  EmailErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref EmailFunction }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  PaymentErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref PaymentFunction }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  DeadLetters:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt JobsDLQ.QueueName }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
Outputs:
  FrontendBucket: { Value: !Ref FrontendBucket }
  BackupBucket: { Value: !Ref BackupBucket }
  DistributionId: { Value: !Ref Distribution }
  FrontendUrl: { Value: !Sub 'https://${Distribution.DomainName}' }
  ApiUrl: { Value: !Sub 'https://${Distribution.DomainName}/api' }
